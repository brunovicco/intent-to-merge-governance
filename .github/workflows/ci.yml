name: Governance reference tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.10'
          enable-cache: false
      - run: python scripts/release_inventory.py verify --require-lock
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv sync --locked --extra telemetry
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: ITM_REQUIRE_TELEMETRY=1 python -m unittest discover -s tests -v
      - run: python scripts/rc1_validate.py --out results/rc1-local
      - run: python scripts/rc1_external.py --self-test
      - run: python scripts/live_benchmark.py --fixture --out results/rc2-fixtures
      - run: python scripts/adversarial_benchmark.py --out results/rc3-adversarial
      - run: python scripts/control_plane.py demo --out results/rc4-local
      - run: python scripts/integrated_runtime.py run --fixture repair --out results/rc6-repair
      - run: python scripts/journal_checkpoint.py --db results/rc6-repair/lifecycle.sqlite
      - run: |
          python scripts/operational_demo.py --out results/operational-study
          cmp examples/operational-v1/report.json results/operational-study/report.json
      - run: |
          intent-merge benchmark-replay --profile historical-v1 --bundles examples/amgb-v1/bundles --public-key examples/amgb-v1/signer.pub --output results/amgb-replay
          cmp examples/amgb-v1/report.json results/amgb-replay/report.json
      - run: |
          intent-merge changeset-demo --out results/changeset-study
          ROOT=$(python -c 'import json; print(json.load(open("examples/changeset-v1/anchor.json"))["config_digest"])')
          intent-merge changeset-verify --config examples/changeset-v1/config.json --receipt examples/changeset-v1/compatible/receipt.json --expected-config-digest "$ROOT"
  docker-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.10'
          enable-cache: false
      - run: python scripts/release_inventory.py verify --require-lock
      - run: uv sync --locked --extra telemetry
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: docker pull python:3.11-slim
      - run: python scripts/rc1_external.py --docker --out results/rc1-docker.json
      - run: |
          intent-merge demo --scenario happy --executor docker --out results/docker-happy
          python -c 'import json; assert json.load(open("results/docker-happy/evidence/report.json"))["merged"]'
          intent-merge audit --out results/docker-happy --anchor results/docker-happy/anchor.json --trust results/docker-happy/demo-trust.json
      - run: |
          git clone --bare results/docker-happy/repo results/docker-candidate.git
          BASE=$(python -c 'import json; print(json.load(open("results/docker-happy/evidence/report.json"))["base"])')
          HEAD=$(python -c 'import json; print(json.load(open("results/docker-happy/evidence/report.json"))["candidate"])')
          itm-ops verify-candidate --repo results/docker-candidate.git --base "$BASE" --head "$HEAD" --spec examples/spec.toml --backend docker
