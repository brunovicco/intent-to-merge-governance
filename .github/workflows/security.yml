name: Public release security checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  scans:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.10'
          enable-cache: false
      - run: |
          GOBIN="$RUNNER_TEMP/itm-tools" go install github.com/gitleaks/gitleaks/v8@v8.24.3
          echo "$RUNNER_TEMP/itm-tools" >> "$GITHUB_PATH"
      - run: bash scripts/public_security.sh
