<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="Multi-repository change-set study"><rect width="1000" height="480" fill="#f4f7f7"/><g font-family="system-ui,sans-serif" fill="#16343d"><text x="40" y="48" font-size="28" font-weight="700">A compatible final state is not enough.</text><text x="40" y="76" font-size="15">ITM v0.8 · actual local Git fixtures · declared contract versions</text><g font-size="17" font-weight="600"><text x="40" y="125">Unsafe intermediate state</text><text x="40" y="265">Compatible staged rollout</text></g><g stroke="#a5b9bd" stroke-width="2" fill="white"><rect x="40" y="142" width="275" height="78" rx="8"/><rect x="360" y="142" width="275" height="78" rx="8" stroke="#ba593e"/><rect x="680" y="142" width="275" height="78" rx="8"/><rect x="40" y="282" width="275" height="78" rx="8"/><rect x="360" y="282" width="275" height="78" rx="8" stroke="#16877b"/><rect x="680" y="282" width="275" height="78" rx="8" stroke="#16877b"/></g><g font-size="15"><text x="56" y="167">Payments v1</text><text x="56" y="193">Checkout requires v1</text><text x="376" y="167">Payments v2 only</text><text x="376" y="193" fill="#ba593e">Checkout still requires v1</text><text x="696" y="167">Payments v2</text><text x="696" y="193">Checkout requires v2</text><text x="56" y="307">Payments v1</text><text x="56" y="333">Checkout requires v1</text><text x="376" y="307">Payments v1 + v2</text><text x="376" y="333">Checkout still requires v1</text><text x="696" y="307">Payments v1 + v2</text><text x="696" y="333">Checkout requires v2</text></g><g font-size="26"><text x="325" y="188">→</text><text x="645" y="188">→</text><text x="325" y="328">→</text><text x="645" y="328">→</text></g><text x="40" y="405" font-size="20" font-weight="700" fill="#16877b">8 scenarios · 5 blocked before coordinator writes · 3 signed receipts</text><text x="40" y="437" font-size="14">Synthetic demo; no claim of atomicity, behavioral API proof or production rollback. Portal dependency omitted for clarity.</text></g></svg>
