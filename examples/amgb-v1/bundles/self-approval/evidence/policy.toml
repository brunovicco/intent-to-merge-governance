version = 1
max_iterations = 4
max_no_progress = 2
required_checks = ["positive_amount", "same_key_same_payment", "distinct_keys", "conflicting_payload", "scope", "trusted_harness", "intent_drift", "requirement_coverage", "checkpoint_binding", "property_invariants", "differential_compatibility", "contract_flow", "mutation_adequacy"]
protected_paths = ["tests/**", ".github/**", "policy.toml", "spec.toml"]

[convergence]
max_cases = 148
max_diff_bytes = 12000
max_reopened = 1

[approvers]
reviewer = "engineering"
security = "security"

[[risk_rules]]
path = "docs/**"
level = "low"
required_roles = []

[[risk_rules]]
path = "app/**"
level = "medium"
required_roles = ["engineering"]

[[risk_rules]]
path = "app/payments.py"
level = "high"
required_roles = ["engineering", "security"]
